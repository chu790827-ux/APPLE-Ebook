<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A-P-P-L-E Bundle 電子書</title>
<style>
body{margin:0;background:#eef3f7;font-family:Arial,"Microsoft JhengHei",sans-serif;text-align:center;color:#203449}
header{background:white;padding:16px}
h1{font-size:clamp(20px,4vw,30px);margin:5px}
nav{background:white;padding:15px;position:sticky;top:0}
button{background:#216a91;color:white;border:0;border-radius:8px;padding:12px 20px;font-size:16px;margin:5px}
button:disabled{opacity:.4}
img{display:block;max-width:95%;width:850px;height:auto;margin:20px auto;box-shadow:0 3px 15px #aaa}
</style>
</head>
<body>
<header><h1>腦中風病人血壓調控之組合式照護</h1><p>A-P-P-L-E Bundle 電子書</p></header>
<nav><button onclick="change(-1)">上一頁</button><span id="num">1 / 22</span><button onclick="change(1)">下一頁</button></nav>
<img id="book" src="1.jpg" alt="電子書">
<script>
let page=1;
function change(n){page=Math.max(1,Math.min(22,page+n));document.getElementById("book").src=page+".jpg";document.getElementById("num").textContent=page+" / 22";}
</script>
</body>
</html>
